name: Bug report
description: Report a problem with gcbad_dart
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the
        sections below so we can reproduce and fix the issue quickly.

        ⚠️ **Do not include your GoCardless secret ID/key or any real
        credentials, tokens, or account data in this report.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code or steps that trigger the problem.
      render: dart
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: gcbad_dart version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: dart-version
    attributes:
      label: Dart/Flutter SDK version
      description: Output of `dart --version`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: >-
        Paste any `GoCardlessException` message or stack trace. Redact any
        secrets or account data first.
      render: shell
    validations:
      required: false
