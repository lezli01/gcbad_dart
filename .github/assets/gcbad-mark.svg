<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="gcbad_dart logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square badge -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Bank building glyph: pediment, architrave, columns, and plinth -->
  <g fill="#FFFFFF">
    <!-- Pediment (roof) -->
    <path d="M256 138 L400 232 L112 232 Z"/>
    <!-- Architrave beam -->
    <rect x="128" y="240" width="256" height="26" rx="5"/>
    <!-- Columns -->
    <rect x="146" y="276" width="28" height="70" rx="4"/>
    <rect x="210" y="276" width="28" height="70" rx="4"/>
    <rect x="274" y="276" width="28" height="70" rx="4"/>
    <rect x="338" y="276" width="28" height="70" rx="4"/>
    <!-- Base + plinth -->
    <rect x="120" y="352" width="272" height="24" rx="6"/>
    <rect x="100" y="382" width="312" height="18" rx="8" fill-opacity="0.9"/>
  </g>
</svg>
